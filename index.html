
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>自動顔モザイク v0.3</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color-scheme:dark}
body{background:#10131a;color:#f5f6fa;margin:0 auto;padding:20px;max-width:780px}
h1{font-size:24px}
.panel{background:#202632;padding:16px;border-radius:16px;margin:14px 0}
input,button,select{font:inherit}
button{border:0;background:#4879fa;color:white;border-radius:10px;padding:12px 16px;margin:4px 4px 4px 0}
button:disabled{opacity:.4}
canvas{width:100%;background:#08090d;border-radius:12px}
label{display:block;margin:12px 0}
.sub{color:#b9c1d1;font-size:13px;line-height:1.6}
progress,input[type=range]{width:100%}
#status{white-space:pre-wrap;overflow-wrap:anywhere}
a{color:#8db5ff}
</style>
</head>
<body>
<h1>🎭 自動顔モザイク v0.3</h1>
<p class="sub">動画は端末内で処理します。初回はAIモデルをネットから取得します。実験版：音声保持・出力時間の正確さは保証できません。</p>

<section class="panel">
<label>① 動画を選択
<input id="file" type="file" accept="video/*">
</label>
<label>② モザイクの粗さ
<input id="size" type="range" min="8" max="42" value="20">
</label>
<label>顔の範囲
<input id="margin" type="range" min="1" max="2" step="0.1" value="1.4">
</label>
<label>解析間隔
<select id="fps">
<option value="8">8回/秒（軽量）</option>
<option value="15" selected>15回/秒（標準）</option>
<option value="24">24回/秒（高精度）</option>
</select>
</label>
<button id="start" disabled>③ 自動処理を開始</button>
<button id="stop" disabled>停止</button>
<p id="status" class="sub">動画を選択してください。</p>
<progress id="progress" max="100" value="0"></progress>
</section>

<section class="panel">
<video id="video" playsinline muted preload="metadata" style="display:none"></video>
<canvas id="canvas"></canvas>
<p class="sub">顔検出漏れの可能性があります。投稿前に必ず全編を確認してください。</p>
<div id="download"></div>
</section>

<script>
const $=id=>document.getElementById(id);
const video=$('video');
const canvas=$('canvas');
const ctx=canvas.getContext('2d',{willReadFrequently:true});
let detector,abort=false,url,stream,recorder,parts=[],running=false;
const status=t=>$('status').textContent=t;

$('file').onchange=()=>{
  if(url)URL.revokeObjectURL(url);
  const f=$('file').files[0];
  $('start').disabled=true;
  if(!f)return;
  url=URL.createObjectURL(f);
  video.src=url;
  video.load();
  $('download').replaceChildren();
  status('動画を読み込み中… '+f.name+' ('+Math.round(f.size/1048576)+' MB)');
};

video.onloadedmetadata=()=>{
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;
  if(!canvas.width||!canvas.height){
    status('エラー: 動画の映像サイズを読み取れません');
    return;
  }
  $('start').disabled=false;
  status(`動画を読み込みました: ${canvas.width}×${canvas.height} / ${Number.isFinite(video.duration)?video.duration.toFixed(1)+'秒':'長さ不明'}。処理開始を押してください。`);
};

video.onerror=()=>{
  const e=video.error;
  status('動画読み込みエラー: '+(e?('コード '+e.code+' / '):'')+'Safariが映像を読み込めません。');
  $('start').disabled=true;
};

function loadScript(src){
  return new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src=src;
    s.crossOrigin='anonymous';
    s.onload=resolve;
    s.onerror=()=>reject(new Error('AIライブラリの取得に失敗: '+src));
    document.head.appendChild(s);
  });
}

async function loadDetector(){
  if(detector)return;
  status('AIライブラリを読み込み中…');
  if(!window.vision){
    await loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/vision_bundle.js');
  }
  const api=window.vision;
  if(!api||!api.FaceDetector||!api.FilesetResolver)
    throw Error('AIライブラリが読み込まれましたが、顔検出APIが見つかりません。');

  status('AIモデルを初期化中…');
  const resolver=await api.FilesetResolver.forVisionTasks(
    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm'
  );
  detector=await api.FaceDetector.createFromOptions(resolver,{
    baseOptions:{
      modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite',
      delegate:'CPU'
    },
    runningMode:'IMAGE',
    minDetectionConfidence:.35
  });
}

function mosaic(x,y,w,h){
  const margin=Number($('margin').value);
  const sz=Number($('size').value);
  const cx=x+w/2,cy=y+h/2;
  const left=Math.max(0,Math.floor(cx-w*margin/2));
  const top=Math.max(0,Math.floor(cy-h*margin/2));
  const right=Math.min(canvas.width,Math.ceil(cx+w*margin/2));
  const bottom=Math.min(canvas.height,Math.ceil(cy+h*margin/2));
  const W=right-left,H=bottom-top;
  if(W<1||H<1)return;
  const temp=document.createElement('canvas');
  temp.width=Math.max(1,Math.floor(W/sz));
  temp.height=Math.max(1,Math.floor(H/sz));
  temp.getContext('2d').drawImage(canvas,left,top,W,H,0,0,temp.width,temp.height);
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(temp,0,0,temp.width,temp.height,left,top,W,H);
  ctx.imageSmoothingEnabled=true;
}

async function seek(time){
  if(Math.abs(video.currentTime-time)<.001)return;
  await new Promise((resolve,reject)=>{
    let timeout=setTimeout(()=>{
      cleanup();
      reject(new Error('動画のシークがタイムアウトしました'));
    },15000);
    function cleanup(){
      clearTimeout(timeout);
      video.removeEventListener('seeked',done);
    }
    function done(){cleanup();resolve();}
    video.addEventListener('seeked',done,{once:true});
    video.currentTime=time;
  });
}

const wait=ms=>new Promise(r=>setTimeout(r,ms));
$('stop').onclick=()=>{
  abort=true;
  status('停止処理中…');
};

$('start').onclick=async()=>{
  if(running)return;
  running=true;
  abort=false;
  $('start').disabled=true;
  $('stop').disabled=false;
  $('download').replaceChildren();

  try{
    await loadDetector();
    if(!Number.isFinite(video.duration)||video.duration<=0)
      throw Error('動画の長さを取得できません');
    if(typeof MediaRecorder==='undefined')
      throw Error('このSafariではMediaRecorderが利用できません');

    const fps=Number($('fps').value);
    const types=[
      'video/mp4;codecs=avc1.42E01E',
      'video/mp4',
      'video/webm;codecs=vp8',
      'video/webm'
    ];
    const mime=types.find(t=>MediaRecorder.isTypeSupported(t));
    if(!mime||!canvas.captureStream)
      throw Error('このSafariはCanvas録画に対応していません。書き出し方式の変更が必要です。');

    stream=canvas.captureStream(0);
    let track=stream.getVideoTracks()[0];
    let manual=typeof track.requestFrame==='function';
    if(!manual){
      stream.getTracks().forEach(t=>t.stop());
      stream=canvas.captureStream(fps);
      track=stream.getVideoTracks()[0];
    }

    parts=[];
    recorder=new MediaRecorder(stream,{
      mimeType:mime,
      videoBitsPerSecond:Math.min(12000000,Math.max(1500000,canvas.width*canvas.height*3))
    });
    recorder.ondataavailable=e=>{
      if(e.data.size)parts.push(e.data);
    };
    const stopped=new Promise((res,rej)=>{
      recorder.onstop=res;
      recorder.onerror=()=>rej(Error('録画失敗'));
    });

    await seek(0);
    recorder.start();
    const frames=Math.ceil(video.duration*fps);

    for(let i=0;i<=frames;i++){
      if(abort)break;
      const t=Math.min(video.duration-.001,i/fps);
      await seek(Math.max(0,t));
      ctx.drawImage(video,0,0,canvas.width,canvas.height);
      const detections=detector.detect(canvas).detections;
      for(const d of detections){
        const b=d.boundingBox;
        mosaic(b.originX,b.originY,b.width,b.height);
      }
      if(manual)track.requestFrame();
      await wait(1000/fps);
      $('progress').value=Math.round(100*i/frames);
      if(i%5===0)
        status(`処理中: ${Math.round(100*i/frames)}% / 顔 ${detections.length} 件（現在のフレーム）`);
    }

    recorder.stop();
    await stopped;
    stream.getTracks().forEach(t=>t.stop());

    if(parts.length){
      const blob=new Blob(parts,{type:mime});
      const out=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=out;
      a.download='face-mosaic.'+(mime.includes('mp4')?'mp4':'webm');
      a.textContent='処理済み動画を保存';
      $('download').append(a);
      status(abort?'途中までの動画を生成しました。':'処理完了。保存後、顔の検出漏れを確認してください。');
    }else{
      status('動画が生成されませんでした。');
    }
  }catch(e){
    status('エラー: '+(e&&e.message||String(e)));
  }finally{
    if(stream)stream.getTracks().forEach(t=>t.stop());
    $('start').disabled=false;
    $('stop').disabled=true;
    running=false;
  }
};
</script>
</body>
</html>
